name: Integrar análise no index

on:
  push:
    branches: [correcao/auditoria-pluviometro]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[analysis-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correcao/auditoria-pluviometro
          fetch-depth: 1
      - name: Corrigir e inserir script de análise no HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="analysis-integration.js"></script>'
          marker = '</body>'
          s = s.replace(tag, '')
          if marker not in s:
              raise SystemExit('Não encontrei </body> no index.html')
          head, tail = s.rsplit(marker, 1)
          s = head + tag + '\n' + marker + tail
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar posição da integração
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          tag = '<script src="analysis-integration.js"></script>'
          assert s.count(tag) == 1
          assert s.rfind(tag) < s.rfind('</body>')
          report_marker = 'printWindow.document.write(`'
          if report_marker in s:
              report = s.split(report_marker, 1)[1].split('`);', 1)[0]
              assert tag not in report
          PY
      - name: Commit da integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrige integração da análise no HTML [analysis-integrated]'
          git push origin HEAD:correcao/auditoria-pluviometro
